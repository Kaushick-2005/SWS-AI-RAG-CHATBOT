<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWS AI RAG Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Livvic', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 700px;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            justify-content: flex-end;
        }

        .user-message .message-content {
            background: #1e3c72;
            color: white;
            border-radius: 12px 12px 0 12px;
            padding: 12px 16px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .ai-message .message-content {
            background: #f0f4f8;
            color: #333;
            border-radius: 12px 12px 12px 0;
            padding: 12px 16px;
            max-width: 85%;
            word-wrap: break-word;
        }

        .sources {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            font-style: italic;
        }

        .sources strong {
            color: #1e3c72;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
        }

        .dots {
            display: inline-flex;
            gap: 4px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1e3c72;
            animation: bounce 1.4s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            40% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-group {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px 16px;
            font-family: 'Livvic', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #1e3c72;
        }

        .send-btn {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-family: 'Livvic', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30, 60, 114, 0.4);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Scrollbar styling */
        .chat-box::-webkit-scrollbar {
            width: 8px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        .chat-box::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .welcome-message {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .container {
                max-height: 80vh;
            }

            .header h1 {
                font-size: 20px;
            }

            .user-message .message-content,
            .ai-message .message-content {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SWS AI Assistant</h1>
            <p>Ask me about company policies, leave, benefits, and more!</p>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="welcome-message">
                👋 Welcome! Ask me anything about SWS AI company policies.
            </div>
        </div>

        <div class="input-area">
            <div class="input-group">
                <input 
                    type="text" 
                    id="questionInput" 
                    placeholder="Ask about leave policy, IT security, benefits..."
                    onkeypress="handleKeyPress(event)"
                >
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/chat';
        const chatBox = document.getElementById('chatBox');
        const questionInput = document.getElementById('questionInput');
        const sendBtn = document.getElementById('sendBtn');

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const question = questionInput.value.trim();
            
            if (!question) return;

            // Clear input
            questionInput.value = '';
            sendBtn.disabled = true;

            // Add user message
            addMessage(question, 'user');

            // Show loading
            const loadingId = addMessage('', 'ai', true);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question })
                });

                if (!response.ok) {
                    throw new Error('API request failed');
                }

                const data = await response.json();
                
                // Remove loading message and add response
                document.getElementById(loadingId)?.remove();
                addMessage(data.answer, 'ai', false, data.sources);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById(loadingId)?.remove();
                addMessage('Sorry, I encountered an error. Please try again.', 'ai');
            } finally {
                sendBtn.disabled = false;
                questionInput.focus();
            }
        }

        function addMessage(text, sender, isLoading = false, sources = []) {
            if (chatBox.children.length === 1 && chatBox.children[0].classList.contains('welcome-message')) {
                chatBox.innerHTML = '';
            }

            const messageDiv = document.createElement('div');
            const messageId = 'msg-' + Date.now();
            messageDiv.id = messageId;
            messageDiv.className = `message ${sender}-message`;

            if (isLoading) {
                messageDiv.innerHTML = `
                    <div class="message-content">
                        <div class="loading">
                            <span>Thinking</span>
                            <div class="dots">
                                <div class="dot"></div>
                                <div class="dot"></div>
                                <div class="dot"></div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                let html = `<div class="message-content">${escapeHtml(text)}`;
                if (sources && sources.length > 0) {
                    html += `<div class="sources"><strong>Sources:</strong> ${sources.join(', ')}</div>`;
                }
                html += '</div>';
                messageDiv.innerHTML = html;
            }

            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            return messageId;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Focus on input on load
        window.addEventListener('load', () => {
            questionInput.focus();
        });
    </script>
</body>
</html>
